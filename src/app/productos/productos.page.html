<ion-header *ngIf="!escaneando">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-menu-button color="secondary"></ion-menu-button>
    </ion-buttons>
    <ion-title color="secondary">Inventario</ion-title>
  </ion-toolbar>

  <ion-toolbar color="dark">
    <div style="display: flex; align-items: center; padding-right: 10px;">
      <ion-searchbar placeholder="Buscar nombre o código..." [(ngModel)]="textoBusqueda" (ionInput)="buscarProducto($event)" style="padding-right: 0; flex: 1;"></ion-searchbar>
      
      <ion-button fill="clear" color="secondary" (click)="escanearParaBuscar()">
        <ion-icon slot="icon-only" name="barcode-outline" style="font-size: 28px;"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>

 <ion-toolbar color="dark">
  <div style="display: flex; gap: 10px; padding: 0 15px; margin-bottom: 10px; overflow-x: auto;">
    
    <ion-select label="Categoría" label-placement="floating" interface="popover" [(ngModel)]="filtroCategoria" (ionChange)="cambiarFiltroCategoria($event)" style="min-width: 120px; background: #333; border-radius: 8px;">
      <ion-select-option value="Todas">Todas</ion-select-option>
      <ion-select-option *ngFor="let cat of categoriasUnicas" [value]="cat">{{ cat }}</ion-select-option>
    </ion-select>

    <ion-select label="Marca" label-placement="floating" interface="popover" [(ngModel)]="filtroMarca" (ionChange)="cambiarFiltroMarca($event)" style="min-width: 120px; background: #333; border-radius: 8px;">
      <ion-select-option value="Todas">Todas</ion-select-option>
      <ion-select-option *ngFor="let marca of marcasUnicas" [value]="marca">{{ marca }}</ion-select-option>
    </ion-select>

    <ion-select label="Proveedor" label-placement="floating" interface="popover" [(ngModel)]="filtroDistribuidor" (ionChange)="cambiarFiltroDistribuidor($event)" style="min-width: 120px; background: #333; border-radius: 8px;">
      <ion-select-option value="Todos">Todos</ion-select-option>
      <ion-select-option *ngFor="let dist of distribuidoresUnicos" [value]="dist">{{ dist }}</ion-select-option>
    </ion-select>
    
  </div>
</ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [class.scanner-active]="escaneando">

  <div *ngIf="!escaneando">
    <ion-list>
      <ion-item-sliding *ngFor="let producto of productosFiltrados">
        
        <ion-item (click)="abrirDetalle(producto)">
          <ion-thumbnail slot="start">
            <img [src]="producto.imagen || 'assets/shapes.svg'" alt="{{ producto.nombre }}" />
          </ion-thumbnail>
          <ion-label>
            <h2>{{ producto.nombre }}</h2>
            <p>Marca: {{ producto.marca || 'N/A' }} | Prov: {{ producto.distribuidor || 'N/A' }}</p>
            <p>Stock: {{ producto.stock }} | Cod: {{ producto.codigoBarras }}</p>
          </ion-label>
          <ion-label slot="end" class="ion-text-right">
            <h2 style="color: var(--ion-color-secondary); font-weight: bold;">${{ producto.precio }}</h2>
          </ion-label>
        </ion-item>

        <ion-item-options side="end" *ngIf="authService.userData">
          <ion-item-option color="primary" (click)="abrirEditor(producto)">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="confirmarEliminacion(producto.id)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-item-option>
        </ion-item-options>

      </ion-item-sliding>
    </ion-list>

    <ion-fab *ngIf="authService.userData" vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button routerLink="/agregar-producto" color="secondary">
        <ion-icon name="add" style="color: black;"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  </div>

  <div *ngIf="escaneando" class="scanner-overlay">
    
    <h2 class="scanner-text">Escanea para buscar</h2>
    
    <div class="scanner-box">
      <div class="laser"></div>
    </div>

    <ion-button (click)="detenerEscaneo()" color="danger" class="btn-cancelar">
      Cancelar Escaneo
    </ion-button>

  </div>

</ion-content>
