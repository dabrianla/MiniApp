<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>ROSA SPA</ion-list-header>
          <ion-note>Botillería</ion-note>

          <ion-note *ngIf="authService.userData" style="color: var(--ion-color-secondary); font-weight: bold; margin-top: 5px;">
            Conectado como: {{ authService.userData.rol | uppercase }}
          </ion-note>

          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
                
                <ion-badge 
                  color="secondary" 
                  slot="end" 
                  class="badge-novedad"
                  *ngIf="p.id === 'alertas' && (inventarioService.novedadesNoLeidas$ | async)">
                  Nuevo
                </ion-badge>

              </ion-item>
            </ion-menu-toggle>
          }

          <!-- Sección de administración (solo visible para admins) -->
          <div *ngIf="authService.userData">
            <div class="seccion-admin-divider">
              <span>Administración</span>
            </div>
            @for (p of adminPages; track p) {
              <ion-menu-toggle auto-hide="false">
                <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                  <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'" color="secondary"></ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                  
                  <ion-badge 
                    color="danger" 
                    slot="end"
                    *ngIf="(inventarioService.alertasNoLeidas$ | async) as alertas">
                    {{ alertas > 0 ? alertas : '' }}
                  </ion-badge>
                </ion-item>
              </ion-menu-toggle>
            }
          </div>

          <ion-menu-toggle auto-hide="false" *ngIf="!authService.userData">
            <ion-item routerDirection="root" routerLink="/login" lines="none" detail="false" routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" ios="lock-closed-outline" md="lock-closed-sharp"></ion-icon>
              <ion-label>Acceso Admin</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false" *ngIf="authService.userData">
            <ion-item button (click)="cerrarSesion()" lines="none" detail="false">
              <ion-icon aria-hidden="true" slot="start" ios="log-out-outline" md="log-out-sharp" color="danger"></ion-icon>
              <ion-label color="danger">Cerrar Sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>

        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
